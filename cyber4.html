<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberdeck Terminal - IMMIGRANT THOUGHTS</title>
    <style>
        body { 
            margin: 0; padding: 0; background-color: #000; color: #00ff41; 
            font-family: 'Courier New', Courier, monospace; overflow: hidden; 
            display: flex; justify-content: center; align-items: center; height: 100vh; 
        }
        #boot-screen {
            position: absolute; z-index: 10; font-size: 1.1rem; text-align: center;
            text-shadow: 0 0 15px #00ff41; background: #000; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer;
        }
        .blink-text { animation: blink 0.8s infinite; }
        canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        .cyber-container { 
            position: relative; z-index: 2; width: 88vw; max-width: 380px; height: 80vh; 
            display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; pointer-events: none;
        }
        #text-output { 
            font-size: 0.95rem; line-height: 1.4; white-space: pre-wrap; word-break: break-word; 
            color: #1aff66; text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41; transition: color 0.1s ease;
        }
        .cursor { 
            display: inline-block; width: 8px; height: 0.95rem; background-color: #1aff66; 
            animation: blink 1s step-end infinite; vertical-align: middle; box-shadow: 0 0 10px #00ff41;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        @keyframes glitch-anim {
            0% { transform: translate(0); filter: hue-rotate(0deg); }
            15% { transform: translate(-5px, 3px); color: #ff0055; text-shadow: 0 0 20px #ff0055; }
            30% { transform: translate(-3px, -4px); }
            45% { transform: translate(6px, 4px); color: #00ffff; text-shadow: 0 0 20px #00ffff; }
            60% { transform: translate(-4px, 2px); }
            75% { transform: translate(4px, -3px); color: #ff0055; text-shadow: 0 0 20px #ff0055; }
            100% { transform: translate(0); }
        }
        .glitch-active { animation: glitch-anim 0.4s infinite; }
        .scanlines { 
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(0,0,0,0.2) 50%); 
            background-size: 100% 4px; pointer-events: none; z-index: 3; 
        }
    </style>
</head>
<body>
    <div id="boot-screen">
        <div>[ SYSTEM SECURE LOCK ]</div><br>
        <div class="blink-text">> CLICK TO BOOT TERMINAL <</div>
    </div>
    <div class="scanlines"></div>
    <canvas id="matrixCanvas"></canvas>
    <div class="cyber-container">
        <div><span id="text-output"></span><span class="cursor"></span></div>
    </div>

    <script>
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        function playClickSound() {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(600 + Math.random() * 400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.03);
            } catch(e) {}
        }
        function playGlitchSound() {
            if (!audioCtx) return;
            try {
                let bufferSize = audioCtx.sampleRate * 0.4, buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate), data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1);
                let noise = audioCtx.createBufferSource(); noise.buffer = buffer;
                let filter = audioCtx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.setValueAtTime(1200, audioCtx.currentTime);
                let gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.08, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.005, audioCtx.currentTime + 0.4);
                noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); noise.start();
            } catch(e) {}
        }

        const canvas = document.getElementById('matrixCanvas'), ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const katakana = 'АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const fontSize = 16, columns = canvas.width / fontSize, drops = [];
        for (let x = 0; x < columns; x++) drops[x] = 1;
        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.07)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = katakana.charAt(Math.floor(Math.random() * katakana.length));
                let yCoord = drops[i] * fontSize, normY = yCoord / canvas.height, alpha = 0.5;
                if (normY < 0.25) alpha = 0.5; else if (normY >= 0.25 && normY <= 0.65) alpha = 0.5 * (1 - (normY - 0.25) / 0.4); else alpha = 0.12;
                ctx.fillStyle = `rgba(0, 102, 34, ${alpha})`; ctx.fillText(text, i * fontSize, yCoord);
                if (yCoord > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 30);

        const textArray = [
            "SYS_INIT: SECURE CHANNEL v9.4\nCONNECTING TO REMOTE NODE...\nBYPASSING PROXY... [OK]\nESTABLISHING ENCRYPTED LINK...",
            "========================================\n  VASILII SHALAMOV\n  IMMIGRANT THOUGHTS\n========================================",
            "PART 1. THE SHOWCASE ILLUSION\n\nFirst, they show you the country.\nNot the country, but a picture.\nSkyscrapers. Cars. Houses. Clean streets. Smiles.\nYou are told: you can start over here.\nYou believe it.\nEspecially if there is nothing to wait for back home.\nThere are no hospital queues, no shared rooms, and no old man counting change in the picture.\nOnly the result is on display.\nThe causes are hidden.",
            "PART 2. THE RITE AND THE FUEL\n\nThen the visa process begins. Paperwork, interviews, proof. You prove your attachment to the place you are running from. You've paid for everything, but you haven't bought the ticket yet. The high price of entry makes the prize more valuable. And if you choose a lottery, you win a chance. And you burn your bridges. You sell your car, pack your bags, and take all your savings there. But this isn't wealth. This is fuel for the furnace.",
            "PART 3. CONSUMABLE MATERIAL\n\nYou arrive and start paying for every breath. You find a job. You toil. As long as you have money and keep the wheel spinning, you are useful. But the tragedy begins when you break. You get sick, the money runs out, the rent goes up. And for the first time, you ask for help. At that moment, you cease to be a resident. You become an expense. A budget digit that the system begins to squeeze out through fear and other people's hands.",
            "PART 4. THE PERFECT SWINDLE\n\nA local doesn't need this bondage—they have the open Europe. Those who have nowhere else to go are the ones who come. And America was just the first to patent this conveyor belt of hope. Dreiser, Sinclair, Steinbeck—they all described this machine already. But the point is elsewhere. No one dragged you by the hand. You filled out the application yourself, bought the ticket yourself, and sat down at this rigged table yourself. And when you are left with nothing, they tell you: you wanted this yourself. That is the perfection of the game.",
            "TERMINAL SHUTDOWN...\nEXEC PROTOCOL: C[ ᗧ ] V"
        ];

        const textOutput = document.getElementById("text-output");
        const bootScreen = document.getElementById("boot-screen");
        let screenIndex = 0, charIndex = 0, glitchTriggered = false, started = false;

        bootScreen.addEventListener('click', () => {
            if (started) return;
            started = true;
            initAudio();
            bootScreen.style.opacity = '0';
            setTimeout(() => bootScreen.style.display = 'none', 500);
            setTimeout(typeWriter, 600);
        });

        function typeWriter() {
            if (screenIndex < textArray.length) {
                let currentText = textArray[screenIndex];
                if (charIndex === 0) { textOutput.innerHTML = ""; glitchTriggered = false; }
                if (screenIndex === 3 && charIndex === Math.floor(currentText.length / 2) && !glitchTriggered) {
                    glitchTriggered = true;
                    textOutput.classList.add('glitch-active');
                    playGlitchSound();
                    setTimeout(() => { textOutput.classList.remove('glitch-active'); }, 1200);
                }
                if (charIndex < currentText.length) {
                    let char = currentText.charAt(charIndex);
                    textOutput.innerHTML += char;
                    if (char !== ' ' && char !== '\n') playClickSound();
                    charIndex++;
                    let speed = (screenIndex === 0) ? 25 : ((screenIndex === textArray.length - 1) ? 120 : Math.floor(Math.random() * 50) + 45);
                    setTimeout(typeWriter, speed);
                } else {
                    let holdTime = (screenIndex === 0) ? 2500 : ((screenIndex === 1) ? 4500 : 5500);
                    if (screenIndex === 1) {
                        textOutput.classList.add('glitch-active');
                        playGlitchSound();
                        setTimeout(() => {
                            textOutput.classList.remove('glitch-active');
                            textOutput.innerHTML = "";
                            screenIndex++; charIndex = 0;
                            setTimeout(typeWriter, 1500);
                        }, 1800);
                    } else {
                        setTimeout(() => {
                            textOutput.innerHTML = "";
                            screenIndex++; charIndex = 0;
                            setTimeout(typeWriter, 1500);
                        }, holdTime);
                    }
                }
            } else {
                setTimeout(() => { screenIndex = 0; charIndex = 0; textOutput.innerHTML = ""; typeWriter(); }, 5000);
            }
        }
    </script>
</body>
</html>
