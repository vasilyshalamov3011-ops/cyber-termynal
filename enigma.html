<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURE UPLINK // ENIGMA-M</title>
    <style>
        body {
            background-color: #050505; 
            color: #00ff41; 
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            font-size: 18px; /* Базовый размер для ПК */
            font-weight: bold;
            overflow-x: hidden;
        }

        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            z-index: 100;
            pointer-events: none;
            box-shadow: inset 0 0 100px rgba(0,255,65,0.15);
        }

        #matrixCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            opacity: 0.4; 
            pointer-events: none;
        }

        .terminal-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 50px 15px 30px 15px; 
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
            z-index: 10; 
        }

        .terminal-frame {
            border: 2px solid #00ff41;
            padding: 20px;
            min-height: 70vh;
            box-shadow: inset 0 0 15px rgba(0,255,65,0.05);
        }

        #exit-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            cursor: pointer;
            border: 1px solid #00ff41;
            background: rgba(0, 255, 65, 0.1);
            color: #00ff41;
            padding: 5px 10px;
            font-size: 14px;
            z-index: 101;
            transition: all 0.2s;
        }

        #exit-btn:hover {
            background-color: #00ff41;
            color: #050505;
            box-shadow: 0 0 15px #00ff41;
        }

        #output p {
            margin: 5px 0;
            line-height: 1.4;
            white-space: pre-wrap; /* Грамотный перенос строк по словам */
            word-wrap: break-word; /* Страховка для аномально длинных слов */
        }

        .input-line {
            display: flex;
            margin-top: 15px;
        }

        .input-line span {
            margin-right: 10px;
            white-space: pre;
        }

        input {
            background: transparent;
            border: none;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            font-weight: bold;
            outline: none;
            width: 100%;
        }

        /* МОБИЛЬНАЯ АДАПТАЦИЯ */
        @media (max-width: 600px) {
            body { font-size: 14px; }
            input { font-size: 14px; }
            .terminal-container { padding: 40px 10px 20px 10px; }
            .terminal-frame { padding: 12px; }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="crt-overlay"></div>
    <canvas id="matrixCanvas"></canvas>
    
    <audio id="bg-audio" loop preload="auto">
        <source src="https://github.com/tholman/elevator.js/blob/master/demo/music/elevator.mp3?raw=true" type="audio/mpeg">
    </audio>
    
    <div id="exit-btn" onclick="window.location.href='index.html'">
        [X] ZAMKNIJ / ЗАКРЫТЬ
    </div>

    <div class="terminal-container">
        <div class="terminal-frame">
            <div id="output"></div>
            <div id="input-container" class="input-line hidden">
                <span>>_ </span>
                <input type="text" id="userInput" autocomplete="off" autofocus>
            </div>
        </div>
    </div>

    <script>
        const outputDiv = document.getElementById("output");
        const inputContainer = document.getElementById("input-container");
        const userInput = document.getElementById("userInput");
        const bgAudio = document.getElementById("bg-audio");
        bgAudio.volume = 0.05; 

        // =========================================================
        // МАТРИЧНЫЙ ДОЖДЬ
        // =========================================================
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$+-*/=%""\'#&_(),.;:?!\\|{}<>[]^~';
        const fontSize = 16;
        let columns = Math.floor(canvas.width / fontSize);
        const drops = [];
        for (let x = 0; x < columns; x++) drops[x] = 1;

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff41';
            ctx.font = fontSize + 'px monospace';
            
            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        // =========================================================
        // КЛЮЧИ И TELEGRAM ENDPOINT
        // =========================================================
        const _k1 = "ODg5NDc3ODk3NjpBQUhlU0kt";
        const _k2 = "YzlUX3VpZU5mS2Zzdy16emZs";
        const _k3 = "Nk04dHJfbEMtMA==";
        const _target = "NDQwMjE0NjY5"; 
        
        const _sys_key = atob(_k1 + _k2 + _k3);
        const _node_id = atob(_target);
        const _domain_part1 = "aHR0cHM6Ly9hcGkudGVsZWdyYW0ub3JnL2JvdA==";
        const _domain_part2 = "L3NlbmRNZXNzYWdl";
        const _endpoint = atob(_domain_part1) + _sys_key + atob(_domain_part2);

        // =========================================================
        // АУДИО И ПЕЧАТЬ
        // =========================================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playKeystroke() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime); 
            gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        async function typeText(text, speed = 30) {
            const p = document.createElement("p");
            outputDiv.appendChild(p);
            
            for (let i = 0; i < text.length; i++) {
                // Исключили innerHTML и неразрывные пробелы. Используем чистый textContent
                p.textContent += text.charAt(i); 
                if (text.charAt(i) !== " ") playKeystroke();
                window.scrollTo(0, document.body.scrollHeight);
                await new Promise(r => setTimeout(r, speed + Math.random() * 20));
            }
            return Promise.resolve();
        }

        // =========================================================
        // РАДАР И ЛОГИКА
        // =========================================================
        let lastUpdateId = 0;
        let isPolling = false;
        
        let currentStep = "alias"; 
        let userAlias = "Unknown"; 

        async function initRadar() {
            const url = atob("aHR0cHM6Ly9hcGkudGVsZWdyYW0ub3JnL2JvdA==") + _sys_key + atob("L2dldFVwZGF0ZXM=");
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.ok && data.result.length > 0) {
                    lastUpdateId = data.result[data.result.length - 1].update_id;
                }
            } catch (e) {}
            isPolling = true;
            scanEther();
        }

        async function scanEther() {
            if (!isPolling) return;
            const url = atob("aHR0cHM6Ly9hcGkudGVsZWdyYW0ub3JnL2JvdA==") + _sys_key + atob("L2dldFVwZGF0ZXM/b2Zmc2V0PQ==") + (lastUpdateId + 1);
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.ok && data.result.length > 0) {
                    for (const update of data.result) {
                        lastUpdateId = update.update_id; 
                        if (update.message && update.message.text) {
                            if (update.message.text.startsWith('/')) continue;
                            
                            inputContainer.classList.add("hidden");
                            await typeText(" ", 10);
                            await typeText(">>> UWAGA! PRZYCHODZĄCA TRANSMISJA / ВХОДЯЩИЙ СИГНАЛ <<<", 20);
                            await typeText(`[CREATOR / СОЗДАТЕЛЬ]: ${update.message.text}`, 40);
                            await typeText(" ", 10);
                            inputContainer.classList.remove("hidden");
                            userInput.focus();
                        }
                    }
                }
            } catch (e) {}
            setTimeout(scanEther, 3000);
        }

        async function bootSequence() {
            // Укоротил полосы для мобилок
            await typeText("=======================================", 10);
            await typeText(" PROTOKÓŁ «ENIGMA-M» | KANAŁ OTWARTY", 20);
            await typeText(" ПРОТОКОЛ «ЭНИГМА-M» | КАНАЛ ОТКРЫТ", 20);
            await typeText(" SECURE UPLINK TO CREATOR / ЗАЩИЩЕННАЯ СВЯЗЬ", 20);
            await typeText("=======================================", 10);
            await typeText(" ", 10);
            
            await typeText("[!] Aktywny czas odpowiedzi: 10:00 - 15:00 (Gdańsk)", 20);
            await typeText("[!] Время прямого ответа: 10:00 - 15:00 (Гданьск)", 20);
            await typeText("[!] Poza godzinami: offline / Вне графика: офлайн", 20);
            await typeText(" ", 10);
            
            await typeText("[*] Cyfrowy konfesjonał. Anonimowy czat bez twarzy.", 25);
            await typeText("[*] Цифровая исповедальня. Анонимный чат без лиц.", 25);
            await typeText("[*] Wyrzuć to z siebie. / Выложи душу.", 30);
            await typeText(" ", 10);
            
            await typeText("[*] Inicjalizacja radaru... / Запуск сканера сети...", 15);
            await initRadar(); 
            
            await typeText("Podaj swój kryptonim / Введи свой позывной:", 20);
            
            inputContainer.classList.remove("hidden");
            userInput.focus();
        }

        userInput.addEventListener("keypress", async function(e) {
            if (e.key === "Enter" && this.value.trim() !== "") {
                const text = this.value.trim();
                const lowerText = text.toLowerCase();
                this.value = "";
                inputContainer.classList.add("hidden"); 
                
                await typeText(">_ " + text, 15);
                await typeText(" ", 10);
                
                if (lowerText === "exit" || lowerText === "выход" || lowerText === "wyjscie" || lowerText === "wyjście") {
                    isPolling = false; 
                    await typeText("[***] Zamykanie połączenia... / Отключение от узла...", 30);
                    setTimeout(() => { window.location.href = "index.html"; }, 1000);
                    return; 
                }

                if (currentStep === "alias") {
                    userAlias = text; 
                    currentStep = "message"; 
                    
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    bgAudio.play().catch(e => console.log("Фоновое аудио заблокировано", e));
                    
                    await typeText(`[ZAAKCEPTOWANO / ПРИНЯТО] Witam, ${userAlias}.`, 20);
                    await typeText("Oczekiwanie na wprowadzenie danych...", 20);
                    await typeText("Ожидание ввода сообщения...", 20);
                    
                    try {
                        fetch(_endpoint, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                chat_id: _node_id,
                                text: `🔌 **СИСТЕМА:** Пользователь *${userAlias}* подключился к каналу.`,
                                parse_mode: "Markdown"
                            })
                        });
                    } catch (error) {}

                    inputContainer.classList.remove("hidden");
                    userInput.focus();
                    return; 
                }
                
                await typeText("[***] Szyfrowanie i transmisja pakietu...", 30);
                
                try {
                    fetch(_endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: _node_id,
                            text: `📟 **ENIGMA UPLINK**\n👤 От: *${userAlias}*\n\n_${text}_`,
                            parse_mode: "Markdown"
                        })
                    });
                } catch (error) {}

                setTimeout(async () => {
                    await typeText(">>> PAKIET DOSTARCZONY / ПАКЕТ ДОСТАВЛЕН", 20);
                    await typeText("[!] Chłodzenie nadajnika. / Охлаждение передатчика...", 20);
                    await typeText("[!] Proszę czekać 5 sekund / Ожидайте 5 сек...", 20);
                    
                    await new Promise(resolve => setTimeout(resolve, 5000));
                    
                    await typeText("[*] Nadajnik gotowy / Передатчик остыл. Канал свободен.", 20);
                    inputContainer.classList.remove("hidden");
                    userInput.focus();
                }, 1500);
            }
        });

        document.addEventListener("click", (e) => {
            if (e.target.id !== "exit-btn" && !inputContainer.classList.contains("hidden")) {
                userInput.focus();
            }
        });

        window.onload = () => {
            setTimeout(bootSequence, 500);
        };
    </script>
</body>
</html>
