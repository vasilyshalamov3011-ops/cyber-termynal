<script>

// АДРЕС НОВОГО ВОРКЕРА

// =========================================================

// МАТРИЧНЫЙ ДОЖДЬ

// =========================================================

const canvas = document.getElementById('matrixCanvas');

const ctx = canvas.getContext('2d');

function resizeCanvas() {

canvas.width = window.innerWidth;

canvas.height = window.innerHeight;

}

window.addEventListener('resize', resizeCanvas);

resizeCanvas();



const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$+-*/=%""\'#&_(),.;:?!\\|{}<>[]^~';

const fontSize = 16;

let columns = Math.floor(canvas.width / fontSize);

const drops = [];

for (let x = 0; x < columns; x++) drops[x] = 1;



function drawMatrix() {

ctx.fillStyle = 'rgba(5, 5, 5, 0.05)';

ctx.fillRect(0, 0, canvas.width, canvas.height);

ctx.fillStyle = '#00ff41';

ctx.font = fontSize + 'px monospace';


for (let i = 0; i < drops.length; i++) {

const text = chars.charAt(Math.floor(Math.random() * chars.length));

ctx.fillText(text, i * fontSize, drops[i] * fontSize);

if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;

drops[i]++;

}

}

setInterval(drawMatrix, 50);



// =========================================================

// ЗВУКОВОЙ ДВИЖОК

// =========================================================

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();


function playKeystroke() {

if (audioCtx.state === 'suspended') audioCtx.resume();

const osc = audioCtx.createOscillator();

const gainNode = audioCtx.createGain();

osc.type = 'square';

osc.frequency.setValueAtTime(150, audioCtx.currentTime);

gainNode.gain.setValueAtTime(0.04, audioCtx.currentTime);

gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

osc.connect(gainNode);

gainNode.connect(audioCtx.destination);

osc.start();

osc.stop(audioCtx.currentTime + 0.05);

}



function playSnipSound() {

if (audioCtx.state === 'suspended') audioCtx.resume();

const osc = audioCtx.createOscillator();

const gainNode = audioCtx.createGain();

osc.type = 'triangle';

osc.frequency.setValueAtTime(2200, audioCtx.currentTime);

osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.08);

gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);

gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

osc.connect(gainNode);

gainNode.connect(audioCtx.destination);

osc.start();

osc.stop(audioCtx.currentTime + 0.08);

}



function playDefuseFanfare() {

if (audioCtx.state === 'suspended') audioCtx.resume();

[523.25, 659.25, 783.99, 1046.50].forEach((freq, index) => {

setTimeout(() => {

const osc = audioCtx.createOscillator();

const gain = audioCtx.createGain();

osc.type = 'sine';

osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

gain.gain.setValueAtTime(0.12, audioCtx.currentTime);

gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);

osc.connect(gain);

gain.connect(audioCtx.destination);

osc.start();

osc.stop(audioCtx.currentTime + 0.25);

}, index * 90);

});

}



function playExplosionSound() {

if (audioCtx.state === 'suspended') audioCtx.resume();

const osc = audioCtx.createOscillator();

const gain = audioCtx.createGain();

osc.type = 'sawtooth';

osc.frequency.setValueAtTime(140, audioCtx.currentTime);

osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 0.9);

gain.gain.setValueAtTime(0.4, audioCtx.currentTime);

gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.9);

osc.connect(gain);

gain.connect(audioCtx.destination);

osc.start();

osc.stop(audioCtx.currentTime + 0.9);

}



async function typeText(text, speed = 25) {

const p = document.createElement("p");

outputDiv.appendChild(p);


for (let i = 0; i < text.length; i++) {

const char = text.charAt(i);

if (char === '!' || text.includes("BŁĄD") || text.includes("СБОЙ") || text.includes("DETONACJA") || text.includes("ВЗРЫВ") || text.includes("BLOKADA") || text.includes("ALARM")) {

const span = document.createElement('span');

span.style.color = '#ff3333';

span.style.textShadow = '0 0 5px rgba(255,51,51,0.8)';

span.textContent = char;

p.appendChild(span);

} else {

p.appendChild(document.createTextNode(char));

}


if (char !== " ") playKeystroke();

window.scrollTo(0, document.body.scrollHeight);

await new Promise(r => setTimeout(r, speed + Math.random() * 15));

}

return Promise.resolve();

}



// =========================================================

// ПЕРСОНАЛЬНЫЙ СКАНИРУЮЩИЙ РАДАР (С ПРЕДОХРАНИТЕЛЕМ)

let isPolling = false;

let currentStep = "alias";

let pollFailures = 0;


let bombTimerInterval = null;

// ПУЛ ЗАГАДОК-МЕТАФОР

const WIRE_HINTS = {

blue: [

],

"> ZAPISKI // ЗАПИСКИ: Zasilanie to nie wszystko. Zabierz mu rytm. Przetnij linię, która dyktuje moment strzału, a cewka zamilknie. // Питание бесполезно без ритма. Оборви нить, диктующую момент удара, и катушка не выстрелит.",

"> ZAPISKI // ЗАПИСКИ: Mózg wysyła impuls, cewka uderza. Przetnij nerw sygnałowy, zanim układ wyda wyrok. // Мозг шлет импульс, катушка бьет. Перережь сигнальный нерв до того, как система вынесет приговор.",

"> ZAPISKI // ЗАПИСКИ: Zegarek tyka, ale to wahadło nadaje tempo. Zniszcz główną linię synchronizacji iskry. // Часы тикают, но темп задает маятник. Уничтожь главную линию синхронизации искры."

],

red: [

"> ZAPISKI // ЗАПИСКИ: Uderz w samo źródło. Odłącz główną arterię płynącą bezpośrednio z akumulatora. Brak potencjału = brak wybuchu. // Бей в первоисточник. Переруби главную артерию от АКБ. Нет потенциала — нет взрыва.",

"> ZAPISKI // ЗАПИСКИ: Zabierz mu krew. Przetnij grubą żyłę zasilającą, a układ umrze z głodu zanim odliczy do zera. // Обескровь его. Перережь толстую питающую жилу, и система умрет от голода, не успев досчитать до нуля.",

"> ZAPISKI // ЗАПИСКИ: Bestia potrzebuje energii by ugryźć. Odłącz bezpośrednie zasilanie pierwotne, aby wyłączyć jej zęby. // Зверю нужна энергия для укуса. Отключи прямое первичное питание, чтобы вырвать ему зубы."

]

};



async function scanPersonalEther() {

if (!isPolling) return;

try {

const res = await fetch(`${WORKER_GATEWAY}/enigma-poll?sessionId=${myNodeId}`);

if (!res.ok) throw new Error("Network/CORS Error");


pollFailures = 0;

const data = await res.json();


if (data.replies && data.replies.length > 0) {

for (const reply of data.replies) {

inputContainer.classList.add("hidden");

await typeText(" ", 10);

await typeText(">>> TRANSMISJA ZWROTNA // СИГНАЛ СОЗДАТЕЛЯ <<<", 20);

await typeText(`[CREATOR // ШЕФ]: ${reply}`, 35);

await typeText(" ", 10);

inputContainer.classList.remove("hidden");

userInput.focus();

}

}

} catch (e) {

pollFailures++;

if (pollFailures >= 3) {

isPolling = false;

inputContainer.classList.add("hidden");

await typeText(" ", 10);

await typeText("! [BŁĄD RADARU // СБОЙ РАДАРА] Utracono łączność // Потеряна связь с сервером !", 20);

await typeText(" ", 10);

inputContainer.classList.remove("hidden");

userInput.focus();

return;

}

}

if (isPolling) {

setTimeout(scanPersonalEther, 3500);

}

}



function setButtonsEnabled(enabled) {

['blue', 'yellow', 'red'].forEach(c => {

const btn = document.getElementById(`btn-cut-${c}`);

if (btn) {

btn.style.pointerEvents = enabled ? 'all' : 'none';

btn.style.opacity = enabled ? '1' : '0.5';

}

});

}



// =========================================================

// МЕХАНИКА САПЁРА

// =========================================================

function launchBombPanel() {

currentStep = "bomb";

isCutting = false;

setButtonsEnabled(true);


const wires = ['blue', 'yellow', 'red'];

targetCorrectWire = wires[Math.floor(Math.random() * wires.length)];



const hintsForWire = WIRE_HINTS[targetCorrectWire];

const randomHint = hintsForWire[Math.floor(Math.random() * hintsForWire.length)];

bombHintText.textContent = randomHint;



bombPanel.classList.remove("panel-vanish");

bombPanel.classList.remove("hidden");

bombPanel.style.opacity = "1";

bombPanel.style.pointerEvents = "all";

bombTimerDisplay.style.color = "#ff003c";

bombTimerDisplay.style.textShadow = "0 0 15px rgba(255, 0, 60, 0.9)";



wires.forEach(c => {

const el = document.getElementById(`wire-${c}`);

if (el) el.classList.remove("wire-cutted");

});



if (bombTimerInterval) clearInterval(bombTimerInterval);


const startTime = Date.now();

bombTimerInterval = setInterval(() => {

const elapsed = Date.now() - startTime;

const remaining = Math.max(0, 45000 - elapsed);


const secs = Math.floor(remaining / 1000);

const ms = Math.floor((remaining % 1000) / 10);

bombTimerDisplay.textContent = `${String(secs).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;



if (remaining <= 0) {

clearInterval(bombTimerInterval);

triggerExplosion("CZAS MINĄŁ // ВРЕМЯ ВЫШЛО!");

}

}, 43);

}



async function cutWire(color) {

if (isCutting) return;

isCutting = true;

setButtonsEnabled(false);



playSnipSound();

const wireEl = document.getElementById(`wire-${color}`);

if (wireEl) wireEl.classList.add("wire-cutted");



if (color === targetCorrectWire) {

clearInterval(bombTimerInterval);

bombTimerDisplay.style.color = "#00ff41";

bombTimerDisplay.style.textShadow = "0 0 15px #00ff41";

bombTimerDisplay.textContent = "DEFUSED";

playDefuseFanfare();



sessionStorage.setItem('enigma_defused', 'true');



await typeText("\n>>> OBWÓD PRZERWANY // ЦЕПЬ ОБОРВАНА! <<<", 20);

await typeText(">>> [JOHN McCLANE]: «YIPPEE-KI-YAY, MOTHERFUCKER!» <<<", 25);

await typeText("[+] Ładunek rozbrojony. Kanał otwarty. // Заряд обезврежен. Канал открыт.", 20);

await typeText("Wprowadź wiadomość // Введи сообщение dla Шефа:", 20);



setTimeout(() => {

bombPanel.classList.add("panel-vanish");

setTimeout(() => {

bombPanel.classList.add("hidden");

}, 650);

}, 1000);



currentStep = "message";


pollFailures = 0;

isPolling = true;

scanPersonalEther();



inputContainer.classList.remove("hidden");

userInput.focus();

} else {

clearInterval(bombTimerInterval);

triggerExplosion("ZŁY PRZEWÓD // КОРОТКОЕ ЗАМЫКАНИЕ!");

}

}



async function triggerExplosion(reason) {

playExplosionSound();

document.body.style.backgroundColor = "#ff003c";

bombTimerDisplay.textContent = "BOOM!";


setTimeout(() => { document.body.style.backgroundColor = "#050505"; }, 250);



await typeText(`\n! [DETONACJA // ВЗРЫВ] ${reason} !`, 20);

await typeText("! KABOOM! Ładunek eksplodował. Reset... // Заряд сдетонировал. Сброс... !", 20);

await typeText("[!] Chłodzenie elektroniki 5 sekund... // Охлаждение цепи 5 секунд...", 20);



setTimeout(() => {

launchBombPanel();

}, 5000);

}



async function bootSequence() {

await typeText("=======================================", 10);

await typeText(" PROTOKÓŁ «ENIGMA-M» // ПРОТОКОЛ «ЭНИГМА-M»", 20);

await typeText(` PRZYPISANY WĘZEŁ // ВАШ УЗЕЛ: #${myNodeId}`, 20);

await typeText("=======================================", 10);

await typeText(" ", 10);

await typeText("[*] Cyfrowy konfesjonał // Цифровая исповедальня.", 20);


if (sessionStorage.getItem('enigma_defused') === 'true') {

await typeText("[+] Autoryzacja aktywna // Допуск сапёра подтверждён.", 20);

} else {

await typeText("[*] Wymagana autoryzacja // Требуется допуск.", 20);

}


await typeText(" ", 10);

await typeText("Podaj swój kryptonim // Введи свой позывной:", 20);


inputContainer.classList.remove("hidden");

userInput.focus();

}



function igniteEnigma() {

if (audioCtx.state === 'suspended') audioCtx.resume();

bgAudio.volume = 0.25;

bgAudio.play().catch(() => {});



const overlay = document.getElementById("launch-overlay");

overlay.style.opacity = "0";

setTimeout(() => {

overlay.style.display = "none";

bootSequence();

}, 500);

}



// =========================================================

// ОБРАБОТЧИК ВВОДА (ЧАТ И СЕТЬ)

// =========================================================

userInput.addEventListener("keypress", async function(e) {

if (e.key === "Enter" && this.value.trim() !== "") {

const text = this.value.trim();

const lowerText = text.toLowerCase();

this.value = "";

inputContainer.classList.add("hidden");


await typeText(">_ " + text, 15);

await typeText(" ", 10);


if (lowerText === "exit" || lowerText === "выход") {

isPolling = false;

if (bombTimerInterval) clearInterval(bombTimerInterval);

await typeText("[***] Zamykanie połączenia // Отключение от узла...", 25);

setTimeout(() => { window.location.href = "index.html"; }, 800);

return;

}



// Шаг 1: Позывной

if (currentStep === "alias") {

userAlias = text;

await typeText(`[ZAAKCEPTOWANO // ПРИНЯТО] Węzeł #${myNodeId}: ${userAlias}.`, 20);



if (sessionStorage.getItem('enigma_defused') === 'true') {

currentStep = "message";

pollFailures = 0;

isPolling = true;

scanPersonalEther();

await typeText("[+] Ładunek już rozbrojony w tej sesji // Допуск действует.", 20);

await typeText("Wprowadź wiadomość // Введи сообщение dla Шефа:", 20);

inputContainer.classList.remove("hidden");

userInput.focus();

return;

}



await typeText("! [ALARM // ТРЕВОГА] WYKRYTO ŁADUNEK C-4 // ОБНАРУЖЕНА БОМБА !", 20);

await typeText("[*] Rozszyfruj schemat i przetnij kabel // Расшифруй схему и перережь нужный:", 20);


launchBombPanel();

return;

}



// Шаг 2: Отправка сообщений в Telegram (С проверкой лимита)

if (currentStep === "message") {

await typeText("[***] Szyfrowanie pakietu // Передача шифрограммы...", 20);



try {

const res = await fetch(`${WORKER_GATEWAY}/enigma-send`, {

method: 'POST',

headers: { 'Content-Type': 'application/json' },

body: JSON.stringify({

sessionId: myNodeId,

alias: userAlias,

text: text,

isConnect: false

})

});



// 🔴 ПРОВЕРКА НА ЛИМИТ СООБЩЕНИЙ (3 в день)

if (res.status === 429) {

await typeText("! [BLOKADA] Przekroczono limit transferu (3/doba). // Превышен суточный лимит (3/3) !", 20);

await typeText("[!] Chłodzenie rdzenia... Spróbuj ponownie za 24 godziny. // Охлаждение ядра... Попробуй через 24 часа.", 20);


isPolling = false; // Отключаем радар, чтобы не тратил ресурсы


await new Promise(r => setTimeout(r, 2000));

inputContainer.classList.remove("hidden");

userInput.focus();

return;

}



if (!res.ok) throw new Error("CORS or Server Down");



await typeText(`>>> PAKIET DOSTARCZONY // ПАКЕТ ДОСТАВЛЕН [#${myNodeId}]`, 20);

await typeText("[*] Czekaj na odpowiedź w tej karcie // Жди ответа здесь.", 20);

} catch (err) {

await typeText("! [BŁĄD // СБОЙ] Brak łączności z serwerem // Сервер недоступен !", 20);

await typeText("[!] Sprawdź połączenie lub ustawienia Worker // Проверь Worker на Cloudflare.", 20);

}



await new Promise(r => setTimeout(r, 2000));

inputContainer.classList.remove("hidden");

userInput.focus();

return;

}

}

});



document.addEventListener("click", (e) => {

if (e.target.id !== "exit-btn" && !inputContainer.classList.contains("hidden") && currentStep !== "bomb") {

userInput.focus();

}

});

</script>
